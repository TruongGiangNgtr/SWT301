plugins { id 'com.android.application' }
android {
    namespace 'com.swt301.datetimechecker'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.swt301.datetimechecker'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        def apiBaseUrl = providers.gradleProperty('swtApiBaseUrl').orElse('http://10.0.2.2:5080').get()
        buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(apiBaseUrl)
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
