name: Android native Appium demo
on:
  push:
    branches: ['chore/**']
    paths: ['apps/mobile/**', 'apps/web/**', 'tests/mobile-e2e/**', 'ci/run-mobile.py', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPIUM_HOME: ${{ github.workspace }}/.appium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Build API and native APK
        run: |
          dotnet restore SWT.slnx
          dotnet build SWT.slnx -c Release --no-restore
          chmod +x apps/mobile/gradlew
          cd apps/mobile
          ./gradlew --no-daemon assembleDebug
      - name: Install pinned Appium and driver
        run: |
          npm ci --prefix tests/mobile-e2e
          node tests/mobile-e2e/node_modules/appium/index.js driver install uiautomator2@4.2.9
      - name: Enable isolated runner KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run Android emulator and native assertions
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python ci/run-mobile.py
      - name: Upload native evidence and APK
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-appium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/mobile/
            apps/mobile/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/app/build/reports/
          retention-days: 14
          if-no-files-found: warn
