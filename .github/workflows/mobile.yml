name: Android native Appium demo
on:
  push:
    branches: ['chore/**']
    paths: ['apps/mobile/**', 'apps/web/**', 'tests/mobile-e2e/**', 'ci/run-mobile.py', 'ci/mobile-ci.py', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-snapshot-api35-google-apis-x86_64-pixel2
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APPIUM_HOME: ${{ github.workspace }}/.appium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start measured job segment
        run: python ci/mobile-ci.py mark measured-job start
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24 action runtime
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Start Gradle setup measurement
        run: python ci/mobile-ci.py mark gradle-setup start
      - name: Setup Gradle dependency and wrapper cache
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: false
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Prepare SDK and fingerprint snapshot compatibility
        run: |
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          python ci/mobile-ci.py mark gradle-setup end
          python ci/mobile-ci.py mark sdk-preparation start
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          python ci/mobile-ci.py mark sdk-preparation end
      - name: Snapshot key (runner, CPU, SDK revisions and AVD configuration)
        id: avd-key
        run: python ci/mobile-ci.py key
      - name: Build API
        run: |
          dotnet restore SWT.slnx
          dotnet build SWT.slnx -c Release --no-restore
      - name: Build native APK with the existing wrapper
        run: |
          python ci/mobile-ci.py mark gradle-build start
          chmod +x apps/mobile/gradlew
          apps/mobile/gradlew -p apps/mobile --no-daemon assembleDebug
          python ci/mobile-ci.py mark gradle-build end
      - name: Install pinned Appium and driver
        run: |
          npm ci --prefix tests/mobile-e2e
          node tests/mobile-e2e/node_modules/appium/index.js driver install uiautomator2@4.2.9
      - name: Enable isolated runner KVM
        run: sudo chmod 666 /dev/kvm
      # Only this clean AVD and its metadata. Do not cache adb private keys, APKs or test state.
      - name: Start AVD cache restore measurement
        run: python ci/mobile-ci.py mark avd-cache-restore start
      - name: Restore clean AVD snapshot
        id: avd-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/swt301-api35.avd
            ~/.android/avd/swt301-api35.ini
          key: ${{ steps.avd-key.outputs.key }}
      - name: Reject incompatible or incomplete snapshots
        id: avd-prepare
        run: |
          python ci/mobile-ci.py mark avd-cache-restore end
          python ci/mobile-ci.py mark avd-preparation start
          python ci/mobile-ci.py prepare
      - name: Create a clean AVD and save its baseline snapshot on cache miss
        id: avd-seed
        if: steps.avd-prepare.outputs.valid != 'true'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: swt301-api35
          emulator-boot-timeout: 300
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: false
          pre-emulator-launch-script: python ci/mobile-ci.py mark boot-seed start
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python ci/mobile-ci.py seed
      - name: Validate clean snapshot files before caching
        id: avd-validate
        run: |
          python ci/mobile-ci.py mark avd-preparation end
          python ci/mobile-ci.py verify
      # Save immediately, before any application, Appium helper or test is installed.
      - name: Save clean AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true' && steps.avd-validate.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/swt301-api35.avd
            ~/.android/avd/swt301-api35.ini
          key: ${{ steps.avd-key.outputs.key }}
      - name: Quick Boot and run all five native cases
        id: quick
        if: steps.avd-validate.outputs.ready == 'true'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: swt301-api35
          emulator-boot-timeout: 300
          cores: 2
          ram-size: 2048M
          force-avd-creation: false
          disable-animations: true
          pre-emulator-launch-script: python ci/mobile-ci.py mark boot-quick start
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: python ci/mobile-ci.py test quick
      # Retry boot infrastructure only. Once tests have started, a failure stays a failure.
      - name: Discard unusable snapshot before cold fallback
        if: ${{ !cancelled() && steps.quick.outcome != 'success' && hashFiles('TestResults/mobile/quick-started.json') == '' }}
        run: python ci/mobile-ci.py reset
      - name: Safe clean Cold Boot fallback and all five native cases
        id: cold
        if: ${{ !cancelled() && steps.quick.outcome != 'success' && hashFiles('TestResults/mobile/quick-started.json') == '' }}
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: swt301-api35
          emulator-boot-timeout: 300
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: python ci/mobile-ci.py mark boot-cold-fallback start
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save
          script: python ci/mobile-ci.py test cold-fallback
      - name: Require actual five-case evidence and publish measured timings
        if: ${{ always() }}
        run: |
          python ci/mobile-ci.py mark measured-job end
          python ci/mobile-ci.py finish '${{ steps.quick.outcome }}' '${{ steps.cold.outcome }}' '${{ steps.avd-cache.outputs.cache-hit }}' '${{ steps.avd-prepare.outputs.valid }}'
      - name: Upload native evidence and APK
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-appium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/mobile/
            apps/mobile/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/app/build/reports/
          retention-days: 14
          if-no-files-found: warn
